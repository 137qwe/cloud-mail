name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

routes = [
  { pattern = "9mail.cc.cd", custom_domain = true }
]

[[d1_databases]]
binding = "db"
database_name = "email"
database_id = "07eea8a5-8010-4dcd-89a1-bba201c22f1d"

[[kv_namespaces]]
binding = "kv"
id = "8aece685f4cc470f88100395ca24d023"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["9mail.cc.cd"]
admin = "admin@9mail.cc.cd"

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
